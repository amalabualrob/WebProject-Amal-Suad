
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

   <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            font-family: 'segoe UI','Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            line-height: 1;
            margin: 0;
            background: #f5f5f5;
            padding: 50px 20px;
        }

        .navbar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px 60px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid #00bcd4;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            color: #1a9cb0;
        }

        .logo i {
            font-size: 28px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 35px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #158a9c;
        }

        .nav-icons {
            display: flex;
            gap: 20px;
            font-size: 18px;
        }

        .nav-icons i {
            cursor: pointer;
            color: #333;
            transition: color 0.3s;
        }

        .nav-icons i:hover {
            color: #158a9c;
        }

       </style>
</head>
<body>
  
</body>
</html>
